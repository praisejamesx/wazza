name: wazza
description: Local AI operating layer for your phone
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Database
  drift: ^2.22.1
  encrypted_drift:
    git:
      url: https://github.com/simolus3/drift.git
      path: extras/encryption
      ref: 669d2f90a8ab5bade5d2d72ba3eb41c0a68da6f5
  path_provider: ^2.1.5
  path: ^1.9.0

  # Network
  dio: ^5.7.0
  http: ^1.2.2
  connectivity_plus: ^6.1.4

  # Models (LLM)
  llama_flutter_android: ^0.1.0

  # Immutable Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  flutter_markdown: ^0.7.7+1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  dynamic_color: 1.7.0

  # Platform
  share_plus: ^12.0.1
  file_picker: ^10.3.10
  image_picker: ^1.0.4
  url_launcher: ^6.2.5
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0

  # PDF
  pdf: ^3.11.2
  pdfx: ^2.6.0

  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.8
  json_serializable: ^6.8.0
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_foreground.jpg"

dependency_overrides: {}
